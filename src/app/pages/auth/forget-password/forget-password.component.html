
<div class="page-bg py-4">
  <div class="container-fluid px-4">
    <div class="row justify-content-center">

      <!-- Forgot Password -->
      <div class="col-12 col-lg-4">
        <div class="auth-shell">
          <app-header></app-header>

          <div class="auth-card forgot-card">
            <h4>Forgot Password?</h4>
            <p>
              Don't worry! It happens. Please enter your registered email
              or mobile number to reset your password.
            </p>

            <div class="reset-tabs">
              <button class="active">
                <i class="bi bi-envelope-fill"></i> Email
              </button>
              <button>
                <i class="bi bi-phone"></i> Mobile
              </button>
            </div>

            <label>Email Address</label>
            <div class="input-box">
              <i class="bi bi-envelope"></i>
              <input placeholder="Enter your registered email">
            </div>

            <div class="info-box">
              <i class="bi bi-info-circle"></i>
              <span>
                We will send you a password reset link to your registered email address.
              </span>
            </div>

            <button class="primary-btn">
              Send Reset Link <i class="bi bi-send"></i>
            </button>

            <div class="back-login">
              <a routerLink="/login"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </div>
          </div>

          <app-footer></app-footer>
        </div>
      </div>
      <!--End-->

    </div>
  </div>
</div>
