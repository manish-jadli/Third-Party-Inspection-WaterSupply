<section class="hero" [style.background]="backgroundStyle">
  <button class="slider-arrow left" (click)="prev()"><i class="bi bi-chevron-left"></i></button>
  <button class="slider-arrow right" (click)="next()"><i class="bi bi-chevron-right"></i></button>

  <div class="container">
    <div class="hero-content" *ngIf="slides && slides.length">
      <span>{{ slides[current].preTitle }}</span>
      <h2 [innerHTML]="slides[current].title"></h2>
      <p>{{ slides[current].description }}</p>
      <button class="btn hero-btn" *ngIf="slides[current].buttonText">{{ slides[current].buttonText }} <i class="bi bi-arrow-right"></i></button>
    </div>

    <div class="hero-dots">
      <ng-container *ngFor="let s of slides; let i = index">
        <span [class.active]="i === current" (click)="goTo(i)"></span>
      </ng-container>
    </div>
  </div>

</section>
