<section class="feature-section">
  <div class="container-fluid px-4">
    <div class="row g-3">
      <div class="col-lg col-md-4 col-sm-6" *ngFor="let item of features">
        <div class="feature-card">
          <div class="feature-icon" [ngClass]="item.color">
            <i [class]="item.icon"></i>
          </div>
          <div>
            <h5>{{ item.title }}</h5>
            <p>{{ item.text }}</p>
          </div>
          <i class="bi bi-arrow-right ms-auto"></i>
        </div>
      </div>
    </div>
  </div>
</section>
