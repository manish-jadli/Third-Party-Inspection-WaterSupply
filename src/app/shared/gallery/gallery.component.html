
<section class="gallery-section">
  <div class="container-fluid px-4">
    <div class="section-title">
      <h4><i class="bi bi-image"></i> Photo Gallery</h4>
      <a href="#">View All <i class="bi bi-arrow-right"></i></a>
    </div>

    <div class="gallery-wrap">
      <button class="gallery-arrow left"><i class="bi bi-chevron-left"></i></button>

      <div class="gallery-grid">
        <img *ngFor="let img of gallery" [src]="img" alt="Gallery image" />
      </div>

      <button class="gallery-arrow right"><i class="bi bi-chevron-right"></i></button>
    </div>
  </div>
</section>
